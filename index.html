<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yi Sushi</title>
  <style>
    :root {
      --bg: #f6f4ef;
      --surface: #ffffff;
      --surface-soft: #fbfaf7;
      --text: #202124;
      --muted: #69707a;
      --line: #e6e0d6;
      --brand: #d94828;
      --brand-dark: #a93620;
      --accent: #23756b;
      --shadow: 0 18px 45px rgba(37, 32, 26, 0.12);
      --radius: 18px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, rgba(217, 72, 40, 0.09), transparent 30rem),
        linear-gradient(180deg, #fffaf3 0%, var(--bg) 34%, #efebe3 100%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      line-height: 1.5;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      width: min(1180px, 100%);
      margin: 0 auto;
      padding: 18px 14px 28px;
    }

    .hero {
      overflow: hidden;
      position: relative;
      min-height: 230px;
      border-radius: 26px;
      background:
        radial-gradient(circle at 88% 20%, rgba(255, 255, 255, 0.22), transparent 13rem),
        linear-gradient(135deg, #161412 0%, #3f1812 48%, #156157 100%);
      box-shadow: var(--shadow);
      color: #fff;
    }

    .hero-content {
      display: flex;
      min-height: 230px;
      flex-direction: column;
      justify-content: flex-end;
      padding: 28px 22px;
    }

    .eyebrow {
      margin: 0 0 8px;
      color: rgba(255, 255, 255, 0.78);
      font-size: 0.86rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 650px;
      margin: 0;
      font-size: clamp(2rem, 9vw, 4.5rem);
      line-height: 0.98;
      letter-spacing: 0;
    }

    .hero p:last-child {
      max-width: 520px;
      margin: 14px 0 0;
      color: rgba(255, 255, 255, 0.86);
      font-size: 1rem;
    }

    .payment-note {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 14px;
      border: 1px solid rgba(230, 224, 214, 0.96);
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.92);
      box-shadow: 0 10px 28px rgba(37, 32, 26, 0.08);
      padding: 13px 15px;
      color: #343230;
      font-weight: 900;
    }

    .payment-note span {
      border-radius: 999px;
      background: #edf6f3;
      color: var(--accent);
      padding: 5px 10px;
      font-size: 0.82rem;
      white-space: nowrap;
    }

    .layout {
      display: grid;
      gap: 18px;
      margin-top: 18px;
    }

    .menu-area,
    .checkout-area {
      min-width: 0;
    }

    .section-title {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 12px;
      margin: 20px 0 12px;
    }

    .section-title h2 {
      margin: 0;
      font-size: 1.45rem;
      line-height: 1.15;
      letter-spacing: 0;
    }

    .section-title span {
      color: var(--muted);
      font-size: 0.92rem;
      white-space: nowrap;
    }

    .category-tabs {
      display: flex;
      gap: 9px;
      margin: 0 -14px 12px;
      padding: 0 14px 6px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .category-tabs::-webkit-scrollbar {
      display: none;
    }

    .tab-button {
      flex: 0 0 auto;
      min-height: 40px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.78);
      color: #383838;
      padding: 8px 15px;
      font-weight: 700;
      transition: 0.18s ease;
    }

    .tab-button.active {
      border-color: var(--brand);
      background: var(--brand);
      color: #fff;
      box-shadow: 0 10px 25px rgba(217, 72, 40, 0.22);
    }

    .menu-grid {
      display: grid;
      gap: 14px;
    }

    .dish-card {
      overflow: hidden;
      border: 1px solid rgba(230, 224, 214, 0.92);
      border-radius: var(--radius);
      background: rgba(255, 255, 255, 0.92);
      box-shadow: 0 10px 30px rgba(37, 32, 26, 0.07);
    }

    .dish-body {
      padding: 16px;
    }

    .dish-head {
      display: flex;
      align-items: start;
      justify-content: space-between;
      gap: 12px;
    }

    .dish-title {
      margin: 0;
      font-size: 1.08rem;
      line-height: 1.2;
    }

    .dish-price {
      flex: 0 0 auto;
      color: var(--brand-dark);
      font-size: 1.08rem;
      font-weight: 800;
    }

    .dish-category {
      display: inline-flex;
      margin: 8px 0;
      border-radius: 999px;
      background: #edf6f3;
      color: var(--accent);
      padding: 4px 9px;
      font-size: 0.78rem;
      font-weight: 800;
    }

    .dish-desc {
      min-height: 48px;
      margin: 0 0 12px;
      color: var(--muted);
      font-size: 0.93rem;
    }

    .dish-actions {
      display: grid;
      gap: 10px;
    }

    .qty-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .qty-label {
      color: #444;
      font-size: 0.9rem;
      font-weight: 700;
    }

    .stepper {
      display: inline-grid;
      grid-template-columns: 40px 44px 40px;
      align-items: center;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--surface-soft);
    }

    .stepper button {
      width: 40px;
      height: 38px;
      border: 0;
      background: transparent;
      color: var(--brand-dark);
      font-size: 1.28rem;
      font-weight: 800;
      line-height: 1;
    }

    .stepper button:active {
      background: #f0e5dc;
    }

    .qty-value {
      display: grid;
      min-width: 44px;
      height: 38px;
      place-items: center;
      border-inline: 1px solid var(--line);
      color: #222;
      font-weight: 800;
    }

    .note-input,
    .field input {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
      color: var(--text);
      outline: none;
      transition: border-color 0.16s ease, box-shadow 0.16s ease;
    }

    .note-input {
      min-height: 42px;
      padding: 10px 12px;
      resize: vertical;
    }

    .note-input:focus,
    .field input:focus {
      border-color: rgba(217, 72, 40, 0.75);
      box-shadow: 0 0 0 4px rgba(217, 72, 40, 0.12);
    }

    .checkout-card {
      border: 1px solid rgba(230, 224, 214, 0.95);
      border-radius: 22px;
      background: rgba(255, 255, 255, 0.94);
      box-shadow: var(--shadow);
    }

    .cart-card {
      position: sticky;
      bottom: 12px;
      z-index: 5;
      overflow: hidden;
      margin-top: 18px;
    }

    .cart-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 16px 16px 10px;
    }

    .cart-header h2 {
      margin: 0;
      font-size: 1.22rem;
    }

    .cart-count {
      border-radius: 999px;
      background: #f8e6de;
      color: var(--brand-dark);
      padding: 5px 10px;
      font-size: 0.82rem;
      font-weight: 800;
      white-space: nowrap;
    }

    .cart-items {
      display: grid;
      max-height: 260px;
      gap: 10px;
      overflow-y: auto;
      padding: 0 16px 12px;
    }

    .empty-cart {
      border: 1px dashed #d8cfc2;
      border-radius: 14px;
      background: #fffaf4;
      color: var(--muted);
      padding: 18px;
      text-align: center;
    }

    .empty-menu {
      border: 1px dashed #d8cfc2;
      border-radius: var(--radius);
      background: rgba(255, 255, 255, 0.88);
      color: var(--muted);
      padding: 24px;
      text-align: center;
    }

    .cart-item {
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #fff;
      padding: 11px;
    }

    .cart-line {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      font-weight: 800;
    }

    .cart-note {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 0.88rem;
      word-break: break-word;
    }

    .cart-total {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid var(--line);
      padding: 14px 16px 16px;
      font-size: 1.15rem;
      font-weight: 900;
    }

    .form-card {
      margin-top: 18px;
      padding: 16px;
    }

    .form-card h2 {
      margin: 0 0 14px;
      font-size: 1.22rem;
    }

    .customer-form {
      display: grid;
      gap: 12px;
    }

    .field {
      display: grid;
      gap: 7px;
    }

    .field label {
      color: #3f3a34;
      font-size: 0.9rem;
      font-weight: 800;
    }

    .field input {
      min-height: 46px;
      padding: 11px 12px;
    }

    .form-error {
      display: none;
      border-radius: 12px;
      background: #fff0ed;
      color: #9e2e1e;
      padding: 10px 12px;
      font-size: 0.92rem;
      font-weight: 700;
    }

    .form-error.show {
      display: block;
    }

    .submit-button {
      min-height: 50px;
      border: 0;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--brand), var(--brand-dark));
      color: #fff;
      font-size: 1rem;
      font-weight: 900;
      box-shadow: 0 12px 26px rgba(169, 54, 32, 0.22);
      transition: transform 0.16s ease, box-shadow 0.16s ease;
    }

    .submit-button:active {
      transform: translateY(1px);
      box-shadow: 0 8px 18px rgba(169, 54, 32, 0.2);
    }

    .order-result {
      display: none;
      margin-top: 18px;
      padding: 16px;
    }

    .order-result.show {
      display: block;
    }

    .result-head {
      display: flex;
      align-items: start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .result-head h2 {
      margin: 0;
      font-size: 1.2rem;
    }

    .order-meta {
      margin: 3px 0 0;
      color: var(--muted);
      font-size: 0.88rem;
    }

    .send-status {
      min-height: 20px;
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 0.88rem;
      font-weight: 800;
    }

    .send-status.success {
      color: var(--accent);
    }

    .send-status.error {
      color: var(--brand-dark);
    }

    .copy-button {
      flex: 0 0 auto;
      min-height: 38px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
      color: var(--brand-dark);
      padding: 7px 10px;
      font-size: 0.86rem;
      font-weight: 900;
    }

    .sms-box {
      min-height: 210px;
      margin: 0;
      overflow-x: auto;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #1f2328;
      color: #f6f7f8;
      padding: 14px;
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      font-size: 0.9rem;
      line-height: 1.65;
      white-space: pre-wrap;
      word-break: break-word;
    }

    @media (min-width: 680px) {
      .app {
        padding: 24px 22px 36px;
      }

      .hero,
      .hero-content {
        min-height: 320px;
      }

      .hero-content {
        padding: 38px;
      }

      .menu-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .category-tabs {
        margin-inline: 0;
        padding-inline: 0;
      }
    }

    @media (min-width: 1024px) {
      .layout {
        grid-template-columns: minmax(0, 1fr) 380px;
        align-items: start;
        gap: 24px;
      }

      .checkout-area {
        position: sticky;
        top: 20px;
      }

      .cart-card {
        position: static;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="hero" aria-label="Ravintolan esittely">
      <div class="hero-content">
        <p class="eyebrow">Ravintola</p>
        <h1>Yi Sushi</h1>
        <p>Valitse annokset, lisää halutessasi huomioita ja lähetä tilaus suoraan ravintolalle.</p>
      </div>
    </section>

    <div class="payment-note">
      <strong>Maksaminen maksetaan kassalla</strong>
      <span>Kassa</span>
    </div>

    <div class="layout">
      <section class="menu-area" aria-labelledby="menuTitle">
        <div class="section-title">
          <h2 id="menuTitle">Menu</h2>
          <span id="menuCount">0 annosta</span>
        </div>

        <div class="category-tabs" id="categoryTabs" aria-label="Kategoriat"></div>
        <div class="menu-grid" id="menuGrid"></div>
      </section>

      <aside class="checkout-area" aria-label="Ostoskori ja tilaus">
        <section class="checkout-card cart-card">
          <div class="cart-header">
            <h2>Ostoskori</h2>
            <span class="cart-count" id="cartCount">0 kpl</span>
          </div>
          <div class="cart-items" id="cartItems"></div>
          <div class="cart-total">
            <span>Yhteensä</span>
            <span id="cartTotal">0.00€</span>
          </div>
        </section>

        <section class="checkout-card form-card">
          <h2>Asiakastiedot</h2>
          <form class="customer-form" id="orderForm" novalidate>
            <div class="field">
              <label for="customerName">Nimi</label>
              <input id="customerName" name="customerName" type="text" autocomplete="name" placeholder="Kirjoita nimi" />
            </div>
            <div class="field">
              <label for="customerPhone">Puhelin</label>
              <input id="customerPhone" name="customerPhone" type="tel" autocomplete="tel" placeholder="Kirjoita puhelinnumero" />
            </div>
            <div class="field">
              <label for="customerLocation">Pöytä/osoite</label>
              <input id="customerLocation" name="customerLocation" type="text" placeholder="Esim. pöytä 5 / osoite" />
            </div>
            <div class="form-error" id="formError" role="alert"></div>
            <button class="submit-button" type="submit">Lähetä tilaus</button>
          </form>
        </section>

        <section class="checkout-card order-result" id="orderResult" aria-live="polite">
          <div class="result-head">
            <div>
              <h2>Tilauksen viesti</h2>
              <p class="order-meta" id="orderMeta"></p>
              <p class="send-status" id="sendStatus"></p>
            </div>
            <button class="copy-button" id="copySms" type="button">Kopioi</button>
          </div>
          <pre class="sms-box" id="smsText"></pre>
        </section>
      </aside>
    </div>
  </main>

  <script>
    const CATEGORIES = ["Juomat"];
    const CATEGORY_ALIASES = {
      "Juomat": "Juomat"
    };
    const OTHER_MENU_HEADINGS = new Set();
    let menuItems = [];

    const state = {
      activeCategory: "Juomat",
      cart: {}
    };

    // If the frontend is on GitHub Pages and the backend is on Render/Railway,
    // set this to the backend public URL. Keep it empty when both run on one domain.
    const API_BASE_URL = "";

    const categoryTabs = document.getElementById("categoryTabs");
    const menuGrid = document.getElementById("menuGrid");
    const menuCount = document.getElementById("menuCount");
    const cartItems = document.getElementById("cartItems");
    const cartCount = document.getElementById("cartCount");
    const cartTotal = document.getElementById("cartTotal");
    const form = document.getElementById("orderForm");
    const formError = document.getElementById("formError");
    const orderResult = document.getElementById("orderResult");
    const orderMeta = document.getElementById("orderMeta");
    const sendStatus = document.getElementById("sendStatus");
    const smsText = document.getElementById("smsText");
    const copySms = document.getElementById("copySms");

    function formatPrice(value) {
      return `${value.toFixed(2)}€`;
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function isPriceLine(line) {
      return /^\d+(?:[,.]\d{1,2})?\s*€$/.test(line);
    }

    function parsePrice(line) {
      return Number(line.replace("€", "").trim().replace(",", "."));
    }

    function createDishId(name, index) {
      return `${index}-${name}`
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/[^a-z0-9]+/g, "-")
        .replace(/^-|-$/g, "");
    }

    function parseMenuText(text) {
      const lines = text.split(/\r?\n/).map((line) => line.trim()).filter(Boolean);
      const parsedItems = [];
      let currentCategory = "";

      for (let index = 0; index < lines.length; index += 1) {
        const line = lines[index];

        if (CATEGORY_ALIASES[line]) {
          currentCategory = CATEGORY_ALIASES[line];
          continue;
        }

        if (OTHER_MENU_HEADINGS.has(line)) {
          currentCategory = "";
          continue;
        }

        if (!currentCategory || !CATEGORIES.includes(currentCategory) || currentCategory === "Kaikki") {
          continue;
        }

        const priceLine = lines[index + 1];
        if (!priceLine || !isPriceLine(priceLine)) {
          continue;
        }

        let description = "";
        const possibleDescription = lines[index + 2];
        const lineAfterDescription = lines[index + 3];
        const descriptionLooksLikeNextName = possibleDescription && lineAfterDescription && isPriceLine(lineAfterDescription);

        if (
          possibleDescription &&
          !CATEGORY_ALIASES[possibleDescription] &&
          !OTHER_MENU_HEADINGS.has(possibleDescription) &&
          !descriptionLooksLikeNextName
        ) {
          description = possibleDescription;
          index += 2;
        } else {
          index += 1;
        }

        parsedItems.push({
          id: createDishId(line, parsedItems.length + 1),
          name: line,
          category: currentCategory,
          description,
          price: parsePrice(priceLine)
        });
      }

      return parsedItems;
    }

    async function loadMenuItems() {
      if (window.location.protocol === "file:") {
        throw new Error("Avaa sivu palvelimen kautta: http://127.0.0.1:3000/index.html");
      }

      const response = await fetch("menu", { cache: "no-store" });
      if (!response.ok) {
        throw new Error("Menua ei voitu ladata.");
      }

      menuItems = parseMenuText(await response.text());
    }

    function getCategories() {
      return CATEGORIES;
    }

    function getCartItem(id) {
      if (!state.cart[id]) {
        state.cart[id] = { quantity: 0, note: "" };
      }

      return state.cart[id];
    }

    function getSelectedItems() {
      return menuItems
        .map((item) => ({
          ...item,
          quantity: state.cart[item.id]?.quantity || 0,
          note: state.cart[item.id]?.note || ""
        }))
        .filter((item) => item.quantity > 0);
    }

    function getTotal() {
      return getSelectedItems().reduce((sum, item) => sum + item.price * item.quantity, 0);
    }

    function renderCategories() {
      categoryTabs.innerHTML = getCategories()
        .map((category) => `
          <button
            class="tab-button ${category === state.activeCategory ? "active" : ""}"
            type="button"
            data-category="${category}"
          >
            ${escapeHtml(category)}
          </button>
        `)
        .join("");
    }

    function renderMenu() {
      const visibleItems = state.activeCategory === "Kaikki"
        ? menuItems
        : menuItems.filter((item) => item.category === state.activeCategory);

      menuCount.textContent = `${visibleItems.length} annosta`;

      if (visibleItems.length === 0) {
        menuGrid.innerHTML = `<div class="empty-menu">Tässä kategoriassa ei ole vielä tuotteita.</div>`;
        return;
      }

      menuGrid.innerHTML = visibleItems
        .map((item) => {
          const cartItem = getCartItem(item.id);

          return `
            <article class="dish-card">
              <div class="dish-body">
                <div class="dish-head">
                  <h3 class="dish-title">${escapeHtml(item.name)}</h3>
                  <div class="dish-price">${formatPrice(item.price)}</div>
                </div>
                <span class="dish-category">${escapeHtml(item.category)}</span>
                <p class="dish-desc">${escapeHtml(item.description)}</p>
                <div class="dish-actions">
                  <div class="qty-row">
                    <span class="qty-label">Määrä</span>
                    <div class="stepper" aria-label="${escapeHtml(item.name)} määrä">
                      <button type="button" data-action="decrease" data-id="${item.id}" aria-label="Vähennä ${escapeHtml(item.name)}">-</button>
                      <span class="qty-value" id="qty-${item.id}">${cartItem.quantity}</span>
                      <button type="button" data-action="increase" data-id="${item.id}" aria-label="Lisää ${escapeHtml(item.name)}">+</button>
                    </div>
                  </div>
                  <textarea
                    class="note-input"
                    data-action="note"
                    data-id="${item.id}"
                    rows="2"
                    placeholder="Huomio: ei chiliä, ei sipulia..."
                  >${escapeHtml(cartItem.note)}</textarea>
                </div>
              </div>
            </article>
          `;
        })
        .join("");
    }

    function renderCart() {
      const selectedItems = getSelectedItems();
      const totalQuantity = selectedItems.reduce((sum, item) => sum + item.quantity, 0);

      cartCount.textContent = `${totalQuantity} kpl`;
      cartTotal.textContent = formatPrice(getTotal());

      if (selectedItems.length === 0) {
        cartItems.innerHTML = `<div class="empty-cart">Ostoskori on tyhjä</div>`;
        return;
      }

      cartItems.innerHTML = selectedItems
        .map((item) => `
          <div class="cart-item">
            <div class="cart-line">
              <span>${escapeHtml(item.name)} x${item.quantity}</span>
              <span>${formatPrice(item.price * item.quantity)}</span>
            </div>
            <p class="cart-note">Huomio: ${escapeHtml(item.note.trim() || "Ei huomioita")}</p>
          </div>
        `)
        .join("");
    }

    function updateQuantity(id, delta) {
      const cartItem = getCartItem(id);
      cartItem.quantity = Math.max(0, cartItem.quantity + delta);
      renderMenu();
      renderCart();
    }

    function updateNote(id, note) {
      getCartItem(id).note = note;
      renderCart();
    }

    function createOrderNumber() {
      const now = new Date();
      const datePart = [
        now.getFullYear(),
        String(now.getMonth() + 1).padStart(2, "0"),
        String(now.getDate()).padStart(2, "0")
      ].join("");
      const randomPart = Math.floor(1000 + Math.random() * 9000);
      return `${datePart}-${randomPart}`;
    }

    function getLocalTimeText(date) {
      return date.toLocaleString("fi-FI", {
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit"
      });
    }

    function buildSmsText(order) {
      const orderLines = order.items
        .map((item, index) => {
          return `${index + 1}. ${item.name} x${item.quantity}
Huomio: ${item.note.trim() || "Ei huomioita"}`;
        })
        .join("\n\n");

      return `Uusi tilaus #${order.number}

Asiakas: ${order.customer.name}
Puhelin: ${order.customer.phone}
Pöytä/osoite: ${order.customer.location}
Maksu: Maksaminen maksetaan kassalla

Tilaus:
${orderLines}

Yhteensä: ${formatPrice(order.total)}
Aika: ${order.time}`;
    }

    function showError(message) {
      formError.textContent = message;
      formError.classList.add("show");
    }

    function clearError() {
      formError.textContent = "";
      formError.classList.remove("show");
    }

    async function submitOrder() {
      const customer = {
        name: document.getElementById("customerName").value.trim(),
        phone: document.getElementById("customerPhone").value.trim(),
        location: document.getElementById("customerLocation").value.trim()
      };
      const selectedItems = getSelectedItems();

      if (!customer.name) {
        showError("Kirjoita nimi.");
        document.getElementById("customerName").focus();
        return;
      }

      if (!customer.phone) {
        showError("Kirjoita puhelinnumero.");
        document.getElementById("customerPhone").focus();
        return;
      }

      if (!customer.location) {
        showError("Kirjoita pöytä tai osoite.");
        document.getElementById("customerLocation").focus();
        return;
      }

      if (selectedItems.length === 0) {
        showError("Valitse vähintään yksi annos.");
        return;
      }

      clearError();

      const now = new Date();
      const order = {
        number: createOrderNumber(),
        time: getLocalTimeText(now),
        customer,
        items: selectedItems,
        total: getTotal()
      };

      const sms = buildSmsText(order);
      smsText.textContent = sms;
      orderMeta.textContent = `Tilausnumero: ${order.number}`;
      sendStatus.textContent = "Lähetetään Tilausta";
      sendStatus.className = "send-status";
      orderResult.classList.add("show");
      orderResult.scrollIntoView({ behavior: "smooth", block: "start" });

      try {
        const result = await sendSMS(order, sms);
        sendStatus.textContent = result.message || "Tilaus lähetetty.";
        sendStatus.className = "send-status success";
      } catch (error) {
        sendStatus.textContent = error.message;
        sendStatus.className = "send-status error";
      }
    }

    async function sendSMS(order, message) {
      // The backend reads Telegram credentials from environment variables and calls Telegram Bot API.
      if (window.location.protocol === "file:") {
        throw new Error("Avaa sivu palvelimen kautta, esimerkiksi http://127.0.0.1:3000");
      }

      const response = await fetch(`${API_BASE_URL.replace(/\/$/, "")}/api/send-order`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ order, message })
      });

      const data = await response.json().catch(() => ({}));
      if (!response.ok || !data.ok) {
        throw new Error(data.error || "Tilaus-lähetys epäonnistui. Tarkista palvelimen asetukset.");
      }

      return data;
    }

    categoryTabs.addEventListener("click", (event) => {
      const button = event.target.closest("[data-category]");
      if (!button) return;

      state.activeCategory = button.dataset.category;
      renderCategories();
      renderMenu();
    });

    menuGrid.addEventListener("click", (event) => {
      const button = event.target.closest("button[data-action]");
      if (!button) return;

      const { id, action } = button.dataset;
      if (action === "increase") updateQuantity(id, 1);
      if (action === "decrease") updateQuantity(id, -1);
    });

    menuGrid.addEventListener("input", (event) => {
      const input = event.target.closest("[data-action='note']");
      if (!input) return;

      updateNote(input.dataset.id, input.value);
    });

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      submitOrder();
    });

    copySms.addEventListener("click", async () => {
      if (!smsText.textContent.trim()) return;

      try {
        await navigator.clipboard.writeText(smsText.textContent);
        copySms.textContent = "Kopioitu";
        setTimeout(() => {
          copySms.textContent = "Kopioi";
        }, 1600);
      } catch (error) {
        copySms.textContent = "Kopiointi epäonnistui";
        setTimeout(() => {
          copySms.textContent = "Kopioi";
        }, 1600);
      }
    });

    async function init() {
      renderCategories();
      renderCart();
      menuGrid.innerHTML = `<div class="empty-menu">Ladataan menu...</div>`;

      try {
        await loadMenuItems();
        renderMenu();
      } catch (error) {
        menuGrid.innerHTML = `<div class="empty-menu">${escapeHtml(error.message)}</div>`;
      }
    }

    init();
  </script>
</body>
</html>
