<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>餐厅点单</title>
  <style>
    :root {
      --bg: #f6f4ef;
      --surface: #ffffff;
      --surface-soft: #fbfaf7;
      --text: #202124;
      --muted: #69707a;
      --line: #e6e0d6;
      --brand: #d94828;
      --brand-dark: #a93620;
      --accent: #23756b;
      --shadow: 0 18px 45px rgba(37, 32, 26, 0.12);
      --radius: 18px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, rgba(217, 72, 40, 0.09), transparent 30rem),
        linear-gradient(180deg, #fffaf3 0%, var(--bg) 34%, #efebe3 100%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Microsoft YaHei", Arial, sans-serif;
      line-height: 1.5;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    img {
      display: block;
      width: 100%;
    }

    .app {
      width: min(1180px, 100%);
      margin: 0 auto;
      padding: 18px 14px 28px;
    }

    .hero {
      overflow: hidden;
      position: relative;
      min-height: 230px;
      border-radius: 26px;
      background:
        linear-gradient(90deg, rgba(22, 20, 18, 0.82), rgba(22, 20, 18, 0.32)),
        url("https://images.unsplash.com/photo-1555396273-367ea4eb4db5?auto=format&fit=crop&w=1400&q=80") center/cover;
      box-shadow: var(--shadow);
      color: #fff;
    }

    .hero-content {
      display: flex;
      min-height: 230px;
      flex-direction: column;
      justify-content: flex-end;
      padding: 28px 22px;
    }

    .eyebrow {
      margin: 0 0 8px;
      color: rgba(255, 255, 255, 0.78);
      font-size: 0.86rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 650px;
      margin: 0;
      font-size: clamp(2rem, 9vw, 4.5rem);
      line-height: 0.98;
      letter-spacing: 0;
    }

    .hero p:last-child {
      max-width: 520px;
      margin: 14px 0 0;
      color: rgba(255, 255, 255, 0.86);
      font-size: 1rem;
    }

    .layout {
      display: grid;
      gap: 18px;
      margin-top: 18px;
    }

    .menu-area,
    .checkout-area {
      min-width: 0;
    }

    .section-title {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 12px;
      margin: 20px 0 12px;
    }

    .section-title h2 {
      margin: 0;
      font-size: 1.45rem;
      line-height: 1.15;
      letter-spacing: 0;
    }

    .section-title span {
      color: var(--muted);
      font-size: 0.92rem;
      white-space: nowrap;
    }

    .category-tabs {
      display: flex;
      gap: 9px;
      margin: 0 -14px 12px;
      padding: 0 14px 6px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .category-tabs::-webkit-scrollbar {
      display: none;
    }

    .tab-button {
      flex: 0 0 auto;
      min-height: 40px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.78);
      color: #383838;
      padding: 8px 15px;
      font-weight: 700;
      transition: 0.18s ease;
    }

    .tab-button.active {
      border-color: var(--brand);
      background: var(--brand);
      color: #fff;
      box-shadow: 0 10px 25px rgba(217, 72, 40, 0.22);
    }

    .menu-grid {
      display: grid;
      gap: 14px;
    }

    .dish-card {
      overflow: hidden;
      border: 1px solid rgba(230, 224, 214, 0.92);
      border-radius: var(--radius);
      background: rgba(255, 255, 255, 0.92);
      box-shadow: 0 10px 30px rgba(37, 32, 26, 0.07);
    }

    .dish-image {
      height: 180px;
      object-fit: cover;
      background: #ddd4c8;
    }

    .dish-body {
      padding: 14px;
    }

    .dish-head {
      display: flex;
      align-items: start;
      justify-content: space-between;
      gap: 12px;
    }

    .dish-title {
      margin: 0;
      font-size: 1.08rem;
      line-height: 1.2;
    }

    .dish-price {
      flex: 0 0 auto;
      color: var(--brand-dark);
      font-size: 1.08rem;
      font-weight: 800;
    }

    .dish-category {
      display: inline-flex;
      margin: 8px 0;
      border-radius: 999px;
      background: #edf6f3;
      color: var(--accent);
      padding: 4px 9px;
      font-size: 0.78rem;
      font-weight: 800;
    }

    .dish-desc {
      min-height: 48px;
      margin: 0 0 12px;
      color: var(--muted);
      font-size: 0.93rem;
    }

    .dish-actions {
      display: grid;
      gap: 10px;
    }

    .qty-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .qty-label {
      color: #444;
      font-size: 0.9rem;
      font-weight: 700;
    }

    .stepper {
      display: inline-grid;
      grid-template-columns: 40px 44px 40px;
      align-items: center;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--surface-soft);
    }

    .stepper button {
      width: 40px;
      height: 38px;
      border: 0;
      background: transparent;
      color: var(--brand-dark);
      font-size: 1.28rem;
      font-weight: 800;
      line-height: 1;
    }

    .stepper button:active {
      background: #f0e5dc;
    }

    .qty-value {
      display: grid;
      min-width: 44px;
      height: 38px;
      place-items: center;
      border-inline: 1px solid var(--line);
      color: #222;
      font-weight: 800;
    }

    .note-input,
    .field input {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
      color: var(--text);
      outline: none;
      transition: border-color 0.16s ease, box-shadow 0.16s ease;
    }

    .note-input {
      min-height: 42px;
      padding: 10px 12px;
      resize: vertical;
    }

    .note-input:focus,
    .field input:focus {
      border-color: rgba(217, 72, 40, 0.75);
      box-shadow: 0 0 0 4px rgba(217, 72, 40, 0.12);
    }

    .checkout-card {
      border: 1px solid rgba(230, 224, 214, 0.95);
      border-radius: 22px;
      background: rgba(255, 255, 255, 0.94);
      box-shadow: var(--shadow);
    }

    .cart-card {
      position: sticky;
      bottom: 12px;
      z-index: 5;
      overflow: hidden;
      margin-top: 18px;
    }

    .cart-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 16px 16px 10px;
    }

    .cart-header h2 {
      margin: 0;
      font-size: 1.22rem;
    }

    .cart-count {
      border-radius: 999px;
      background: #f8e6de;
      color: var(--brand-dark);
      padding: 5px 10px;
      font-size: 0.82rem;
      font-weight: 800;
      white-space: nowrap;
    }

    .cart-items {
      display: grid;
      max-height: 260px;
      gap: 10px;
      overflow-y: auto;
      padding: 0 16px 12px;
    }

    .empty-cart {
      border: 1px dashed #d8cfc2;
      border-radius: 14px;
      background: #fffaf4;
      color: var(--muted);
      padding: 18px;
      text-align: center;
    }

    .cart-item {
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #fff;
      padding: 11px;
    }

    .cart-line {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      font-weight: 800;
    }

    .cart-note {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 0.88rem;
      word-break: break-word;
    }

    .cart-total {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid var(--line);
      padding: 14px 16px 16px;
      font-size: 1.15rem;
      font-weight: 900;
    }

    .form-card {
      margin-top: 18px;
      padding: 16px;
    }

    .form-card h2 {
      margin: 0 0 14px;
      font-size: 1.22rem;
    }

    .customer-form {
      display: grid;
      gap: 12px;
    }

    .field {
      display: grid;
      gap: 7px;
    }

    .field label {
      color: #3f3a34;
      font-size: 0.9rem;
      font-weight: 800;
    }

    .field input {
      min-height: 46px;
      padding: 11px 12px;
    }

    .form-error {
      display: none;
      border-radius: 12px;
      background: #fff0ed;
      color: #9e2e1e;
      padding: 10px 12px;
      font-size: 0.92rem;
      font-weight: 700;
    }

    .form-error.show {
      display: block;
    }

    .submit-button {
      min-height: 50px;
      border: 0;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--brand), var(--brand-dark));
      color: #fff;
      font-size: 1rem;
      font-weight: 900;
      box-shadow: 0 12px 26px rgba(169, 54, 32, 0.22);
      transition: transform 0.16s ease, box-shadow 0.16s ease;
    }

    .submit-button:active {
      transform: translateY(1px);
      box-shadow: 0 8px 18px rgba(169, 54, 32, 0.2);
    }

    .order-result {
      display: none;
      margin-top: 18px;
      padding: 16px;
    }

    .order-result.show {
      display: block;
    }

    .result-head {
      display: flex;
      align-items: start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .result-head h2 {
      margin: 0;
      font-size: 1.2rem;
    }

    .order-meta {
      margin: 3px 0 0;
      color: var(--muted);
      font-size: 0.88rem;
    }

    .send-status {
      min-height: 20px;
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 0.88rem;
      font-weight: 800;
    }

    .send-status.success {
      color: var(--accent);
    }

    .send-status.error {
      color: var(--brand-dark);
    }

    .copy-button {
      flex: 0 0 auto;
      min-height: 38px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
      color: var(--brand-dark);
      padding: 7px 10px;
      font-size: 0.86rem;
      font-weight: 900;
    }

    .sms-box {
      min-height: 210px;
      margin: 0;
      overflow-x: auto;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #1f2328;
      color: #f6f7f8;
      padding: 14px;
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      font-size: 0.9rem;
      line-height: 1.65;
      white-space: pre-wrap;
      word-break: break-word;
    }

    @media (min-width: 680px) {
      .app {
        padding: 24px 22px 36px;
      }

      .hero,
      .hero-content {
        min-height: 320px;
      }

      .hero-content {
        padding: 38px;
      }

      .menu-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .category-tabs {
        margin-inline: 0;
        padding-inline: 0;
      }
    }

    @media (min-width: 1024px) {
      .layout {
        grid-template-columns: minmax(0, 1fr) 380px;
        align-items: start;
        gap: 24px;
      }

      .checkout-area {
        position: sticky;
        top: 20px;
      }

      .cart-card {
        position: static;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="hero" aria-label="餐厅介绍">
      <div class="hero-content">
        <p class="eyebrow">Today&apos;s Menu</p>
        <h1>小馆即点即享</h1>
        <p>选择菜品数量，给每道菜添加备注，提交后自动整理成短信订单内容。</p>
      </div>
    </section>

    <div class="layout">
      <section class="menu-area" aria-labelledby="menuTitle">
        <div class="section-title">
          <h2 id="menuTitle">菜单</h2>
          <span id="menuCount">0 道菜</span>
        </div>

        <div class="category-tabs" id="categoryTabs" aria-label="菜品分类"></div>
        <div class="menu-grid" id="menuGrid"></div>
      </section>

      <aside class="checkout-area" aria-label="购物车和提交订单">
        <section class="checkout-card cart-card">
          <div class="cart-header">
            <h2>购物车</h2>
            <span class="cart-count" id="cartCount">0 件</span>
          </div>
          <div class="cart-items" id="cartItems"></div>
          <div class="cart-total">
            <span>总价</span>
            <span id="cartTotal">0.00€</span>
          </div>
        </section>

        <section class="checkout-card form-card">
          <h2>顾客信息</h2>
          <form class="customer-form" id="orderForm" novalidate>
            <div class="field">
              <label for="customerName">姓名</label>
              <input id="customerName" name="customerName" type="text" autocomplete="name" placeholder="请输入姓名" />
            </div>
            <div class="field">
              <label for="customerPhone">电话</label>
              <input id="customerPhone" name="customerPhone" type="tel" autocomplete="tel" placeholder="请输入电话" />
            </div>
            <div class="field">
              <label for="customerLocation">桌号/地址</label>
              <input id="customerLocation" name="customerLocation" type="text" placeholder="例如：5号桌 / Helsinki..." />
            </div>
            <div class="form-error" id="formError" role="alert"></div>
            <button class="submit-button" type="submit">提交订单</button>
          </form>
        </section>

        <section class="checkout-card order-result" id="orderResult" aria-live="polite">
          <div class="result-head">
            <div>
              <h2>短信内容</h2>
              <p class="order-meta" id="orderMeta"></p>
              <p class="send-status" id="sendStatus"></p>
            </div>
            <button class="copy-button" id="copySms" type="button">复制</button>
          </div>
          <pre class="sms-box" id="smsText"></pre>
        </section>
      </aside>
    </div>
  </main>

  <script>
    const menuItems = [
      {
        id: "pizza-margherita",
        name: "玛格丽特披萨",
        category: "主食",
        description: "番茄酱、马苏里拉、罗勒和初榨橄榄油，薄底现烤。",
        price: 12.9,
        image: "https://images.unsplash.com/photo-1565299624946-b28f40a0ae38?auto=format&fit=crop&w=700&q=80"
      },
      {
        id: "truffle-pasta",
        name: "黑松露奶油意面",
        category: "主食",
        description: "奶油酱、蘑菇、帕玛森芝士和黑松露香气。",
        price: 14.5,
        image: "https://images.unsplash.com/photo-1621996346565-e3dbc353d2e5?auto=format&fit=crop&w=700&q=80"
      },
      {
        id: "grilled-salmon",
        name: "香煎三文鱼",
        category: "主菜",
        description: "外脆内嫩的三文鱼，搭配柠檬黄油汁和时蔬。",
        price: 18.8,
        image: "https://images.unsplash.com/photo-1467003909585-2f8a72700288?auto=format&fit=crop&w=700&q=80"
      },
      {
        id: "ribeye-steak",
        name: "肋眼牛排",
        category: "主菜",
        description: "炭烤肋眼牛排，可备注熟度，配黑椒汁。",
        price: 24.9,
        image: "https://images.unsplash.com/photo-1558030006-450675393462?auto=format&fit=crop&w=700&q=80"
      },
      {
        id: "garden-salad",
        name: "田园鲜蔬沙拉",
        category: "轻食",
        description: "混合生菜、牛油果、小番茄和香草油醋汁。",
        price: 9.6,
        image: "https://images.unsplash.com/photo-1512621776951-a57141f2eefd?auto=format&fit=crop&w=700&q=80"
      },
      {
        id: "tomato-soup",
        name: "番茄罗勒浓汤",
        category: "轻食",
        description: "慢煮番茄浓汤，带罗勒清香，适合餐前暖胃。",
        price: 7.2,
        image: "https://images.unsplash.com/photo-1547592166-23ac45744acd?auto=format&fit=crop&w=700&q=80"
      },
      {
        id: "tiramisu",
        name: "经典提拉米苏",
        category: "甜品",
        description: "咖啡浸润手指饼干，马斯卡彭奶酪口感轻盈。",
        price: 6.8,
        image: "https://images.unsplash.com/photo-1571877227200-a0d98ea607e9?auto=format&fit=crop&w=700&q=80"
      },
      {
        id: "lemon-tea",
        name: "手作柠檬冰茶",
        category: "饮品",
        description: "新鲜柠檬、红茶和少量蜂蜜，清爽解腻。",
        price: 4.6,
        image: "https://images.unsplash.com/photo-1497534446932-c925b458314e?auto=format&fit=crop&w=700&q=80"
      }
    ];

    const state = {
      activeCategory: "全部",
      cart: {}
    };

    // 如果前端放在 GitHub Pages，后端放在 Render/Railway，把这里改成后端公网地址。
    // 例如：https://your-menu-backend.onrender.com
    // 如果前端和后端部署在同一个域名，保持空字符串即可。
    const API_BASE_URL = "";

    const categoryTabs = document.getElementById("categoryTabs");
    const menuGrid = document.getElementById("menuGrid");
    const menuCount = document.getElementById("menuCount");
    const cartItems = document.getElementById("cartItems");
    const cartCount = document.getElementById("cartCount");
    const cartTotal = document.getElementById("cartTotal");
    const form = document.getElementById("orderForm");
    const formError = document.getElementById("formError");
    const orderResult = document.getElementById("orderResult");
    const orderMeta = document.getElementById("orderMeta");
    const sendStatus = document.getElementById("sendStatus");
    const smsText = document.getElementById("smsText");
    const copySms = document.getElementById("copySms");

    function formatPrice(value) {
      return `${value.toFixed(2)}€`;
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function getCategories() {
      return ["全部", ...new Set(menuItems.map((item) => item.category))];
    }

    function getCartItem(id) {
      if (!state.cart[id]) {
        state.cart[id] = { quantity: 0, note: "" };
      }

      return state.cart[id];
    }

    function getSelectedItems() {
      return menuItems
        .map((item) => ({
          ...item,
          quantity: state.cart[item.id]?.quantity || 0,
          note: state.cart[item.id]?.note || ""
        }))
        .filter((item) => item.quantity > 0);
    }

    function getTotal() {
      return getSelectedItems().reduce((sum, item) => sum + item.price * item.quantity, 0);
    }

    function renderCategories() {
      categoryTabs.innerHTML = getCategories()
        .map((category) => `
          <button
            class="tab-button ${category === state.activeCategory ? "active" : ""}"
            type="button"
            data-category="${category}"
          >
            ${escapeHtml(category)}
          </button>
        `)
        .join("");
    }

    function renderMenu() {
      const visibleItems = state.activeCategory === "全部"
        ? menuItems
        : menuItems.filter((item) => item.category === state.activeCategory);

      menuCount.textContent = `${visibleItems.length} 道菜`;
      menuGrid.innerHTML = visibleItems
        .map((item) => {
          const cartItem = getCartItem(item.id);

          return `
            <article class="dish-card">
              <img class="dish-image" src="${item.image}" alt="${item.name}" loading="lazy" />
              <div class="dish-body">
                <div class="dish-head">
                  <h3 class="dish-title">${escapeHtml(item.name)}</h3>
                  <div class="dish-price">${formatPrice(item.price)}</div>
                </div>
                <span class="dish-category">${escapeHtml(item.category)}</span>
                <p class="dish-desc">${escapeHtml(item.description)}</p>
                <div class="dish-actions">
                  <div class="qty-row">
                    <span class="qty-label">数量</span>
                    <div class="stepper" aria-label="${escapeHtml(item.name)} 数量">
                      <button type="button" data-action="decrease" data-id="${item.id}" aria-label="减少 ${escapeHtml(item.name)}">-</button>
                      <span class="qty-value" id="qty-${item.id}">${cartItem.quantity}</span>
                      <button type="button" data-action="increase" data-id="${item.id}" aria-label="增加 ${escapeHtml(item.name)}">+</button>
                    </div>
                  </div>
                  <textarea
                    class="note-input"
                    data-action="note"
                    data-id="${item.id}"
                    rows="2"
                    placeholder="备注：少辣、不要香菜、牛排熟度..."
                  >${escapeHtml(cartItem.note)}</textarea>
                </div>
              </div>
            </article>
          `;
        })
        .join("");
    }

    function renderCart() {
      const selectedItems = getSelectedItems();
      const totalQuantity = selectedItems.reduce((sum, item) => sum + item.quantity, 0);

      cartCount.textContent = `${totalQuantity} 件`;
      cartTotal.textContent = formatPrice(getTotal());

      if (selectedItems.length === 0) {
        cartItems.innerHTML = `<div class="empty-cart">还没有选择菜品</div>`;
        return;
      }

      cartItems.innerHTML = selectedItems
        .map((item) => `
          <div class="cart-item">
            <div class="cart-line">
              <span>${escapeHtml(item.name)} x${item.quantity}</span>
              <span>${formatPrice(item.price * item.quantity)}</span>
            </div>
            <p class="cart-note">备注：${escapeHtml(item.note.trim() || "无")}</p>
          </div>
        `)
        .join("");
    }

    function updateQuantity(id, delta) {
      const cartItem = getCartItem(id);
      cartItem.quantity = Math.max(0, cartItem.quantity + delta);
      renderMenu();
      renderCart();
    }

    function updateNote(id, note) {
      getCartItem(id).note = note;
      renderCart();
    }

    function createOrderNumber() {
      const now = new Date();
      const datePart = [
        now.getFullYear(),
        String(now.getMonth() + 1).padStart(2, "0"),
        String(now.getDate()).padStart(2, "0")
      ].join("");
      const randomPart = Math.floor(1000 + Math.random() * 9000);
      return `${datePart}-${randomPart}`;
    }

    function getLocalTimeText(date) {
      return date.toLocaleString("zh-CN", {
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit"
      });
    }

    function buildSmsText(order) {
      const orderLines = order.items
        .map((item, index) => {
          return `${index + 1}. ${item.name} x${item.quantity}
备注：${item.note.trim() || "无"}`;
        })
        .join("\n\n");

      return `新订单 #${order.number}

顾客：${order.customer.name}
电话：${order.customer.phone}
桌号/地址：${order.customer.location}

订单：
${orderLines}

总价：${formatPrice(order.total)}
时间：${order.time}`;
    }

    function showError(message) {
      formError.textContent = message;
      formError.classList.add("show");
    }

    function clearError() {
      formError.textContent = "";
      formError.classList.remove("show");
    }

    async function submitOrder() {
      const customer = {
        name: document.getElementById("customerName").value.trim(),
        phone: document.getElementById("customerPhone").value.trim(),
        location: document.getElementById("customerLocation").value.trim()
      };
      const selectedItems = getSelectedItems();

      if (!customer.name) {
        showError("请填写姓名。");
        document.getElementById("customerName").focus();
        return;
      }

      if (!customer.phone) {
        showError("请填写电话。");
        document.getElementById("customerPhone").focus();
        return;
      }

      if (!customer.location) {
        showError("请填写桌号或地址。");
        document.getElementById("customerLocation").focus();
        return;
      }

      if (selectedItems.length === 0) {
        showError("请至少选择一道菜。");
        return;
      }

      clearError();

      const now = new Date();
      const order = {
        number: createOrderNumber(),
        time: getLocalTimeText(now),
        customer,
        items: selectedItems,
        total: getTotal()
      };

      const sms = buildSmsText(order);
      smsText.textContent = sms;
      orderMeta.textContent = `订单编号：${order.number}`;
      sendStatus.textContent = "正在发送到 Telegram...";
      sendStatus.className = "send-status";
      orderResult.classList.add("show");
      orderResult.scrollIntoView({ behavior: "smooth", block: "start" });

      try {
        const result = await sendSMS(order, sms);
        sendStatus.textContent = result.message || "Telegram 已发送。";
        sendStatus.className = "send-status success";
      } catch (error) {
        sendStatus.textContent = error.message;
        sendStatus.className = "send-status error";
      }
    }

    async function sendSMS(order, message) {
      // 后端会读取环境变量中的 Telegram Bot Token 和 Chat ID，再调用 Telegram Bot API。
      if (window.location.protocol === "file:") {
        throw new Error("请通过后端地址打开页面，例如 http://127.0.0.1:3000");
      }

      const response = await fetch(`${API_BASE_URL.replace(/\/$/, "")}/api/send-order`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ order, message })
      });

      const data = await response.json().catch(() => ({}));
      if (!response.ok || !data.ok) {
        throw new Error(data.error || "Telegram 发送失败，请检查后端配置。");
      }

      return data;
    }

    categoryTabs.addEventListener("click", (event) => {
      const button = event.target.closest("[data-category]");
      if (!button) return;

      state.activeCategory = button.dataset.category;
      renderCategories();
      renderMenu();
    });

    menuGrid.addEventListener("click", (event) => {
      const button = event.target.closest("button[data-action]");
      if (!button) return;

      const { id, action } = button.dataset;
      if (action === "increase") updateQuantity(id, 1);
      if (action === "decrease") updateQuantity(id, -1);
    });

    menuGrid.addEventListener("input", (event) => {
      const input = event.target.closest("[data-action='note']");
      if (!input) return;

      updateNote(input.dataset.id, input.value);
    });

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      submitOrder();
    });

    copySms.addEventListener("click", async () => {
      if (!smsText.textContent.trim()) return;

      try {
        await navigator.clipboard.writeText(smsText.textContent);
        copySms.textContent = "已复制";
        setTimeout(() => {
          copySms.textContent = "复制";
        }, 1600);
      } catch (error) {
        copySms.textContent = "复制失败";
        setTimeout(() => {
          copySms.textContent = "复制";
        }, 1600);
      }
    });

    renderCategories();
    renderMenu();
    renderCart();
  </script>
</body>
</html>
